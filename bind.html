<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>LINE 綁定確認中</title>

  <style>
    :root {
      --bg: #F4F0E8;
      --card: #EDE8DC;
      --gold: #C49A30;
      --deep-gold: #8B6B1E;
      --black: #1A1714;
      --muted: #6f675d;
      --white: #ffffff;
      --error: #9b1c1c;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--black);
      font-family: "Noto Sans TC", "Microsoft JhengHei", Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 480px;
      background: var(--card);
      border-radius: 18px;
      padding: 32px 24px;
      text-align: center;
      border: 1px solid rgba(139, 107, 30, 0.18);
      box-shadow: 0 8px 24px rgba(26, 23, 20, 0.08);
    }

    h1 {
      margin: 0 0 14px;
      color: var(--deep-gold);
      font-size: 24px;
    }

    p {
      margin: 0;
      line-height: 1.7;
      font-size: 16px;
      white-space: pre-line;
    }

    .desc {
      color: var(--muted);
      margin-bottom: 0;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 12px 14px;
      border-radius: 12px;
      line-height: 1.7;
      font-weight: 700;
      text-align: left;
      background: #fffdf8;
      color: var(--deep-gold);
      border: 1px solid rgba(139, 107, 30, 0.18);
    }

    .message.error {
      background: #fff1f1;
      color: var(--error);
      border-color: rgba(155, 28, 28, 0.18);
    }

    .btn {
      display: inline-block;
      width: 100%;
      margin-top: 22px;
      background: var(--gold);
      color: var(--white);
      text-decoration: none;
      padding: 15px 24px;
      border-radius: 999px;
      font-weight: 900;
      font-size: 17px;
      border: none;
      cursor: pointer;
    }

    .btn.secondary {
      background: var(--deep-gold);
    }

    .loading {
      margin: 22px auto 0;
      width: 36px;
      height: 36px;
      border: 4px solid rgba(196, 154, 48, 0.25);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>LINE 綁定確認中</h1>

    <p class="desc">
      請稍候，系統正在確認您的 LINE 綁定狀態...
    </p>

    <div class="loading"></div>

    <div id="messageBox" class="message"></div>

    <a id="retryBtn" class="btn secondary" href="javascript:void(0)" style="display:none;">
      重新確認
    </a>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxtMnPWrtIkJHL9Q8z7pdCx-RWg8_KVmdGtLYI8Iy1AR2ei13mE3I1jSqm6gEhnTJ7Gpg/exec";

    const messageBox = document.getElementById("messageBox");
    const retryBtn = document.getElementById("retryBtn");

    function showMessage(message, isError) {
      messageBox.textContent = message;
      messageBox.className = isError ? "message error" : "message";
      messageBox.style.display = "block";
    }

    function jsonp(url, scriptId) {
      const old = document.getElementById(scriptId);
      if (old) old.remove();

      const script = document.createElement("script");
      script.id = scriptId;
      script.src = url;
      document.body.appendChild(script);
    }

    function startBindLineLogin() {
      retryBtn.style.display = "none";
      messageBox.style.display = "none";

      window.handleStartBindLineLogin = function (res) {
        if (!res || !res.ok || !res.loginUrl) {
          showMessage(res && res.message ? res.message : "LINE 綁定確認失敗，請稍後再試。", true);
          retryBtn.style.display = "inline-block";
          return;
        }

        location.href = res.loginUrl;
      };

      const params = new URLSearchParams();
      params.set("action", "startBindLineLogin");
      params.set("callback", "handleStartBindLineLogin");

      jsonp(API_URL + "?" + params.toString(), "jsonpStartBindLineLoginScript");
    }

    retryBtn.addEventListener("click", function () {
      startBindLineLogin();
    });

    startBindLineLogin();
  </script>
</body>
</html>
