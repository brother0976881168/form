<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>資料確認中</title>

  <style>
    :root {
      --bg: #F4F0E8;
      --card: #EDE8DC;
      --gold: #C49A30;
      --deep-gold: #8B6B1E;
      --black: #1A1714;
      --white: #ffffff;
      --error: #9b1c1c;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--black);
      font-family: "Noto Sans TC", "Microsoft JhengHei", Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 480px;
      background: var(--card);
      border-radius: 18px;
      padding: 32px 24px;
      text-align: center;
      border: 1px solid rgba(139, 107, 30, 0.18);
      box-shadow: 0 8px 24px rgba(26, 23, 20, 0.08);
    }

    h1 {
      margin: 0 0 14px;
      color: var(--deep-gold);
      font-size: 24px;
    }

    p {
      margin: 0;
      line-height: 1.7;
      font-size: 16px;
      white-space: pre-line;
    }

    .btn {
      display: inline-block;
      margin-top: 22px;
      background: var(--gold);
      color: var(--white);
      text-decoration: none;
      padding: 14px 24px;
      border-radius: 999px;
      font-weight: 800;
    }

    .sub {
      margin-top: 14px;
      font-size: 14px;
      color: #6f675d;
    }

    .error {
      color: var(--error);
      font-weight: 700;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1 id="title">資料確認中</h1>
    <p id="message">請稍候，系統正在完成資料確認...</p>
    <div id="buttonBox"></div>
    <p id="subText" class="sub"></p>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxtMnPWrtIkJHL9Q8z7pdCx-RWg8_KVmdGtLYI8Iy1AR2ei13mE3I1jSqm6gEhnTJ7Gpg/exec";
    const LINE_ADD_FRIEND_URL = "https://line.me/R/ti/p/@162ftert";

    function setMessage(title, message, isError) {
      document.getElementById("title").textContent = title;
      const msg = document.getElementById("message");
      msg.textContent = message;
      msg.className = isError ? "error" : "";
    }

    function setSubText(text) {
      document.getElementById("subText").textContent = text || "";
    }

    function showAddLineButton() {
      document.getElementById("buttonBox").innerHTML =
        '<a class="btn" href="' + LINE_ADD_FRIEND_URL + '" target="_blank" rel="noopener">加入官方 LINE</a>';
    }

    function jsonp(url, scriptId) {
      const old = document.getElementById(scriptId);
      if (old) old.remove();

      const script = document.createElement("script");
      script.id = scriptId;
      script.src = url;
      document.body.appendChild(script);
    }

    function decodeState(state) {
  try {
    const base64 = state.replace(/-/g, "+").replace(/_/g, "/");
    const jsonText = decodeURIComponent(
      Array.prototype.map.call(atob(base64), function (c) {
        return "%" + ("00" + c.charCodeAt(0).toString(16)).slice(-2);
      }).join("")
    );

    return JSON.parse(jsonText);
  } catch (err) {
    return {};
  }
}

function callLineCallback(code, state) {
  const stateObj = decodeState(state);
  const isBindMode = stateObj.mode === "bind";

  window.handleLineCallback = function (res) {
    if (!res || !res.ok) {
      setMessage("資料確認失敗", res && res.message ? res.message : "系統回寫失敗", true);
      setSubText("");
      return;
    }

    if (isBindMode) {
      setMessage("已完成綁定", "系統已透過官方 LINE 發送確認訊息。", false);
      setSubText("此頁面即將關閉。");

      setTimeout(function () {
        window.close();
      }, 800);

      return;
    }

    checkFriendStatus(res.applyId);

    setTimeout(function () {
      window.location.replace(LINE_ADD_FRIEND_URL);
    }, 500);
  };

  const apiParams = new URLSearchParams();
  apiParams.set("action", "lineCallback");
  apiParams.set("code", code);
  apiParams.set("state", state);
  apiParams.set("callback", "handleLineCallback");

  jsonp(API_URL + "?" + apiParams.toString(), "jsonpLineCallbackScript");
}

    function checkFriendStatus(applyId) {
      setSubText("");

      window.handleFriendStatus = function (res) {
        if (!res || !res.ok) {
          setMessage("資料確認完成", "您的資料已送出，後續將由專人協助確認。", false);
          setSubText("");
          return;
        }

        if (res.officialLineFriendStatus === "是") {
          setMessage("完成", "您的資料已送出，官方 LINE 好友狀態已完成確認。", false);
          setSubText("");
        } else {
          setMessage("資料已送出", "系統尚未確認您已加入官方 LINE。", false);
          setSubText("若已加入，系統後續可再由後台更新確認。");
        }
      };

      const apiParams = new URLSearchParams();
      apiParams.set("action", "checkFriendStatus");
      apiParams.set("applyId", applyId);
      apiParams.set("callback", "handleFriendStatus");

      jsonp(API_URL + "?" + apiParams.toString(), "jsonpFriendStatusScript");
    }

    const params = new URLSearchParams(window.location.search);
    const code = params.get("code");
    const state = params.get("state");
    const error = params.get("error");

    if (error) {
      setMessage("資料確認失敗", "授權未完成，請重新送出表單再試一次。", true);
      setSubText("");
    } else if (!code || !state) {
      setMessage("資料確認失敗", "缺少 LINE 授權資料，請重新送出表單再試一次。", true);
      setSubText("");
    } else {
      callLineCallback(code, state);
    }
  </script>
</body>
</html>
